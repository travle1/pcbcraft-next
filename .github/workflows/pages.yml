name: Publish browser app

# Publication requires a manual run or an explicitly pushed preview tag.
on:
  workflow_dispatch:
  push:
    tags:
      - web-preview-*

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust and browser build tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
          pcbcraft_tools="$RUNNER_TEMP/pcbcraft-web-tools"
          mkdir -p "$pcbcraft_tools"
          cd "$pcbcraft_tools"
          curl --fail --location --retry 3 https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz --output trunk.tar.gz
          printf '%s  %s\n' f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b trunk.tar.gz | sha256sum --check
          tar -xzf trunk.tar.gz
          curl --fail --location --retry 3 https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz --output wasm-bindgen.tar.gz
          printf '%s  %s\n' 9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f wasm-bindgen.tar.gz | sha256sum --check
          tar -xzf wasm-bindgen.tar.gz --strip-components=1
          echo "$pcbcraft_tools" >> "$GITHUB_PATH"
      - name: Fetch locked browser dependencies
        run: cargo +1.95.0 fetch --locked --target wasm32-unknown-unknown
      - name: Build static application and notices
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: trunk build --release --locked --offline
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: target/web-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
